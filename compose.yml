# Dibaca Coolify. `SERVICE_FQDN_WEB_3000` adalah env sentinel Coolify —
# ia menghubungkan port 3000 service `web` ke FQDN yang di-generate Coolify + Traefik.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-run}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-run_dashboard}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-run} -d ${POSTGRES_DB:-run_dashboard}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - SERVICE_FQDN_WEB_3000
      - DATABASE_URL=postgres://${POSTGRES_USER:-run}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-run_dashboard}
      - AUTH_SECRET=${AUTH_SECRET}
      - AUTH_URL=${SERVICE_FQDN_WEB_3000}
      - RUN_MIGRATIONS_ON_START=1
    ports:
      - "3100:3000"

volumes:
  db_data:
