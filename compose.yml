# compose.yml — dibaca Coolify pada build pack "Docker Compose"
# Coolify meng-clone repo di VPS, build image dari Dockerfile lokal, lalu run stack.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-run}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-run_dashboard}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-run} -d ${POSTGRES_DB:-run_dashboard}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-run}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-run_dashboard}
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_URL: ${AUTH_URL}
      RUN_MIGRATIONS_ON_START: "1"
    expose:
      - "3000"
    labels:
      # Coolify + Traefik: auto-configure HTTPS di domain SERVICE_FQDN_WEB
      - "coolify.name=run-management"

volumes:
  db_data:
