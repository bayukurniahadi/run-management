services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-run}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-runpass}
      POSTGRES_DB: ${POSTGRES_DB:-run_dashboard}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-run} -d ${POSTGRES_DB:-run_dashboard}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    image: ghcr.io/${GH_OWNER:-bayukurniahadi}/run-management:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-run}:${POSTGRES_PASSWORD:-runpass}@db:5432/${POSTGRES_DB:-run_dashboard}
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_URL: ${AUTH_URL}
      RUN_MIGRATIONS_ON_START: "1"
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  db_data:
